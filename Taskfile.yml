version: '3'

tasks:
  setup:
    desc: Configure git hooks and verify tooling
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks configured to use .githooks/"

  build:
    desc: Build the acmlab binary
    cmds:
      - go build -o bin/acmlab ./cmd/acmlab/

  test:
    desc: Run all unit tests
    cmds:
      - go test ./...

  test:coverage:
    desc: Run tests with coverage thresholds (same as pre-push hook)
    cmds:
      - .githooks/pre-push

  test:integration:
    desc: Run integration tests (requires live hub connection)
    cmds:
      - go test ./... -tags=integration

  test:bdd:
    desc: Run BDD Gherkin tests via godog (requires live hub connection)
    cmds:
      - go test ./integration/... -tags=integration -v

  test:integration:compile:
    desc: Compile integration tests without running (CI gate)
    cmds:
      - go test -tags=integration -run ^$ ./integration/...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...
